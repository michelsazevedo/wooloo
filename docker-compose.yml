services:
  postgres:
    image: postgres:17
    container_name: wooloo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wooloo
      POSTGRES_PASSWORD: wooloopass
      POSTGRES_DB: wooloo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wooloo -d wooloo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
