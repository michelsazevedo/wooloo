services:
  postgres:
    image: postgres:17
    container_name: wooloo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wooloo
      POSTGRES_PASSWORD: wooloopass
      POSTGRES_DB: wooloo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wooloo -d wooloo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: wooloo-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:14269/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
